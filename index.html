<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de Terços</title>
<meta name="description" content="Custos, produção, estoque e vendas de terços">
<meta name="theme-color" content="#4b3a8c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <nav class="nav" id="nav">
    <div class="brand"><img src="icon-192.png" alt=""><span id="brandName">Terços</span></div>
    <a href="#inicio" data-r="inicio"><span class="ic">⌂</span><span>Início</span></a>
    <a href="#vendas" data-r="vendas"><span class="ic">$</span><span>Vendas</span></a>
    <a href="#producao" data-r="producao"><span class="ic">✚</span><span>Produção</span></a>
    <a href="#estoque" data-r="estoque"><span class="ic">▤</span><span>Estoque</span></a>
    <a href="#mais" data-r="mais"><span class="ic">☰</span><span>Cadastros</span></a>
  </nav>
  <main>
    <header class="top">
      <button class="back" id="back" hidden aria-label="Voltar">‹</button>
      <h1 id="title">Início</h1>
      <div class="top-act" id="topAct"></div>
    </header>
    <section id="view"></section>
  </main>
</div>

<dialog id="dlg">
  <div class="dlg-head"><h2 id="dlgTitle"></h2><button class="x" id="dlgX" aria-label="Fechar">×</button></div>
  <div id="dlgBody" class="dlg-body"></div>
  <div class="dlg-foot">
    <button class="btn danger ghost" id="dlgDel">Excluir</button>
    <span class="grow"></span>
    <button class="btn ghost" id="dlgCancel">Cancelar</button>
    <button class="btn pri" id="dlgSave">Salvar</button>
  </div>
</dialog>
<div id="toast" class="toast" hidden></div>
<input type="file" id="fileImport" accept=".json,application/json" hidden>
<script src="app.js"></script>
</body>
</html>
