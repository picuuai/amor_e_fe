<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de Terços</title>
<meta name="description" content="Custos, produção, estoque e vendas de terços">
<meta name="theme-color" content="#4b2fb0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <nav class="nav" id="nav">
    <div class="brand"><img src="icon-192.png" alt=""><div><b id="brandName">Terços</b><small>Controle do negócio</small></div></div>
    <a href="#inicio" data-r="inicio" data-ic="home"><span>Início</span></a>
    <a href="#vendas" data-r="vendas" data-ic="bag"><span>Vendas</span></a>
    <a href="#producao" data-r="producao" data-ic="sparkles"><span>Produção</span></a>
    <a href="#estoque" data-r="estoque" data-ic="box"><span>Estoque</span></a>
    <a href="#galeria" data-r="galeria" data-ic="image"><span>Galeria</span></a>
    <a href="#oracoes" data-r="oracoes" data-ic="pray"><span>Orações</span></a>
    <a href="#mais" data-r="mais" data-ic="grid"><span>Cadastros</span></a>
    <div class="nav-foot">
      <a class="sync sync-badge" href="#sync"></a>
      <a class="sync" id="bkBadge" href="#backup"></a>
      <button class="theme" id="themeBtn" type="button"></button>
    </div>
  </nav>
  <main>
    <header class="top">
      <button class="back" id="back" hidden aria-label="Voltar"></button>
      <h1 id="title">Início</h1>
      <div class="top-act" id="topAct"></div>
    </header>
    <section id="view"></section>
  </main>
</div>

<dialog id="dlg">
  <div class="dlg-head"><h2 id="dlgTitle"></h2><button class="x" id="dlgX" aria-label="Fechar"></button></div>
  <div id="dlgBody" class="dlg-body"></div>
  <div class="dlg-foot">
    <button class="btn danger ghost" id="dlgDel">Excluir</button>
    <span class="grow"></span>
    <button class="btn ghost" id="dlgCancel">Cancelar</button>
    <button class="btn pri" id="dlgSave">Salvar</button>
  </div>
</dialog>
<div id="toast" class="toast" hidden></div>
<input type="file" id="fileImport" accept=".json,application/json" hidden>
<script src="app.js"></script>
<script src="galeria.js"></script>
<script src="studio.js"></script>
<script src="oracoes.js"></script>
<script src="sync.js"></script>
</body>
</html>
